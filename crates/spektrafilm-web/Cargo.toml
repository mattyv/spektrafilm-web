[package]
name = "spektrafilm-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spektrafilm-core = { workspace = true, features = ["precision-f64"] }
spektrafilm-gpu = { workspace = true, features = ["precision-f64"] }
spektrafilm-math = { workspace = true, features = ["precision-f64"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image.workspace = true
little_exif = "0.6"
base64 = "0.22"
crc32fast = "1"
miniz_oxide = "0.8"
tiff = "0.11"
rawler = "0.7"
uuid = { version = "1", features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
getrandom.workspace = true
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
