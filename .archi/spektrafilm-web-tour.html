// authored (or normalized) with no real x/y — e.g. hand-written bundles that
// omit layout geometry. Mirrors the server-side sequence-layout.ts defaults
// (FIRST_X/X_STEP/HEADER_Y) but without its message-label gap widening; good
// enough to turn an origin-stacked diagram into a readable one.
function layoutSequenceActors(doc) {
    var SEQ_FIRST_X = 160, SEQ_X_STEP = 260, SEQ_HEADER_Y = 20;
    for (var i = 0; i < doc.nodes.length; i++) {
        doc.nodes[i].x = SEQ_FIRST_X + i * SEQ_X_STEP;
        doc.nodes[i].y = SEQ_HEADER_Y;
    }
}

function buildSequence(doc, relayout) {
    graph.clear();
    if (relayout) { layoutSequenceActors(doc); }
    var lifelineHeight = 120 + (doc.edges.length > 0 ? (doc.edges.length - 1) * 70 : 0) + 40;
    // Sequence tuning — no bare magic numbers.
    var SEQ = { actorW: 120, actorH: 60, actorLabelWrapW: 110, actorLabelWrapH: 56 };
    for (var i = 0; i < doc.nodes.length; i++) {
        var actor = doc.nodes[i];
        var actorEvolution = evolutionStyle(actor);
        var rect = new joint.shapes.standard.Rectangle({ id: actor.id });
        rect.position(actor.x - 60, actor.y);
        rect.resize(SEQ.actorW, SEQ.actorH);
        rect.prop('seqActor', true);
        var hasFiles = actor.files && actor.files.length > 0;
        rect.attr({
            body: {
                fill: actorEvolution ? actorEvolution.fill : data.theme.panel,
                stroke: actorEvolution ? actorEvolution.stroke : (hasFiles ? data.theme.accent : data.theme.border),
                strokeWidth: actorEvolution ? 3 : 1.5,
                strokeDasharray: actor.change === 'removed' ? '7 4' : null,
                rx: 8,
                ry: 8,
            },
            label: {
                text: evolutionLabel(actor.label, actor),
                fill: data.theme.fg,
                fontSize: 12,
                // Long actor names wrap inside the box instead of spilling onto neighbours.
                textWrap: { width: SEQ.actorLabelWrapW, height: SEQ.actorLabelWrapH },
            },
        });
        rect.addTo(graph);

        var ll = new joint.shapes.standard.Rectangle({ id: actor.id + '_ll' });
        ll.position(actor.x - 1, actor.y + 60);
        ll.resize(2, lifelineHeight);
        ll.prop('seqLifeline', true);
        ll.attr({
            body: {
                fill: data.theme.border,
                stroke: data.theme.border,
                strokeWidth: 1,
            },
            label: { text: '' },
        });
        ll.addTo(graph);
    }

    for (var k = 0; k < doc.edges.length; k++) {
        var msg = doc.edges[k];
        var msgEvolution = evolutionStyle(msg);
        var msgStroke = msgEvolution ? msgEvolution.stroke : data.theme.muted;
        var link = new joint.shapes.standard.Link();
        link.prop('seqMessage', true);
        link.router({ name: 'normal' }); // sequence messages must stay straight (not manhattan-routed)
        link.set('edgeIndex', k);
        link.source({
            id: msg.from + '_ll',
            anchor: { name: 'top', args: { dy: 120 + k * 70 } },
        });
        link.target({
            id: msg.to + '_ll',
            anchor: { name: 'top', args: { dy: 120 + k * 70 } },
        });
        link.attr({
            line: {
                stroke: msgStroke,
                strokeWidth: msgEvolution ? 3 : 1.5,
                strokeDasharray: msg.change === 'removed' ? '7 4' : null,
                targetMarker: { type: 'path', d: 'M 8 -4 0 0 8 4 z', fill: msgStroke },
            },
        });
        if (msg.label) {
            link.labels([{
                attrs: {
                    // No textWrap: JointJS textWrap on a *link* label renders as "-"
                    // (only element/rectangle labels support it), which blanked every
                    // sequence message label. ponytail: plain single-line label; a long
                    // one can overrun horizontally — acceptable vs invisible. Proper
                    // link-label wrapping (label size + calc refs) if it ever matters.
                    text: { text: evolutionLabel(msg.label, msg), fill: msgStroke, fontSize: 13 },
                    rect: { fill: data.theme.bg, rx: 3, ry: 3 },
                },
                position: 0.5,
            }]);
        }
        link.addTo(graph);
    }
}

function defineClassShape() {
    // Define the UML class shape once (joint.dia.Element.define throws if re-registered).
    if (joint.shapes.archi && joint.shapes.archi.Class) return;
    joint.dia.Element.define('archi.Class', {
        attrs: {
            body: { width: 'calc(w)', height: 'calc(h)', strokeWidth: 1.5, rx: 4, ry: 4 },
            header: {
                x: 10, y: 8, textAnchor: 'start', textVerticalAnchor: 'top',
                fontSize: 13, fontWeight: 'bold',
            },
            divider: { x1: 0, x2: 'calc(w)', strokeWidth: 1 },
            members: {
                x: 10, textAnchor: 'start', textVerticalAnchor: 'top', fontSize: 11,
            },
        },
    }, {
        markup: [
            { tagName: 'rect', selector: 'body' },
            { tagName: 'text', selector: 'header' },
            { tagName: 'line', selector: 'divider' },
            { tagName: 'text', selector: 'members' },
        ],
    });
}

function buildClass(doc, relayout) {
    defineClassShape();
    graph.clear();
    if (relayout) { autoLayout(doc); }
    for (var i = 0; i < doc.nodes.length; i++) {
        var node = doc.nodes[i];
        var members = node.members || [];
        var sz = classSize(node);
        var hasFiles = node.files && node.files.length > 0;
        var classEvolution = evolutionStyle(node);
        var stroke = classEvolution ? classEvolution.stroke : (hasFiles ? data.theme.accent : data.theme.border);
        var rect = new joint.shapes.archi.Class({ id: node.id });
        rect.position(node.x, node.y);
        rect.resize(sz.width, sz.height);
        rect.attr({
            body: { fill: classEvolution ? classEvolution.fill : data.theme.panel, stroke: stroke, strokeWidth: classEvolution ? 3 : 1.5, strokeDasharray: node.change === 'removed' ? '7 4' : null },
            header: { text: evolutionLabel(node.label, node), fill: data.theme.fg },
            divider: { y1: CLASS_HEADER_H, y2: CLASS_HEADER_H, stroke: stroke },
            members: { y: CLASS_HEADER_H + 6, text: wrapClassMembers(members, MAX_MEMBER_CHARS).join('\n'), fill: data.theme.fg },
        });
        rect.addTo(graph);
    }
    // Named marker path constants — UML arrowhead geometry for JointJS SVG paths
    var MARKER_HOLLOW_TRIANGLE  = 'M 18 -10 0 0 18 10 z';   // generalization / realization target
    var MARKER_FILLED_DIAMOND   = 'M 0 0 12 -7 24 0 12 7 z'; // composition source
    var MARKER_HOLLOW_DIAMOND   = 'M 0 0 12 -7 24 0 12 7 z'; // aggregation source (same path, different fill)
    var MARKER_OPEN_ARROW       = 'M 12 -6 0 0 12 6';         // dependency / association target
    var MARKER_OPEN_ARROW_SMALL = 'M 8 -4 0 0 8 4';           // composition / aggregation target (smaller tip)
    var STROKE_COLOR = data.theme.muted;
    var DASHARRAY_DASHED = '6 3'; // realization / dependency dashed line

    for (var j = 0; j < doc.edges.length; j++) {
        var edge = doc.edges[j];
        var classEdgeEvolution = evolutionStyle(edge);
        var classEdgeStroke = classEdgeEvolution ? classEdgeEvolution.stroke : STROKE_COLOR;
        var l = new joint.shapes.standard.Link({
            source: { id: edge.from },
            target: { id: edge.to },
        });
        l.set('edgeIndex', j);

        var targetMarker = null;
        var sourceMarker = null;
        var strokeDasharray = null;

        switch (edge.kind) {
            case 'generalization':
                targetMarker = { type: 'path', d: MARKER_HOLLOW_TRIANGLE, fill: data.theme.bg, stroke: classEdgeStroke };
                break;
            case 'realization':
                targetMarker = { type: 'path', d: MARKER_HOLLOW_TRIANGLE, fill: data.theme.bg, stroke: classEdgeStroke };
                strokeDasharray = DASHARRAY_DASHED;
                break;
            case 'composition':
                targetMarker = { type: 'path', d: MARKER_OPEN_ARROW_SMALL, fill: 'none', stroke: classEdgeStroke };
                sourceMarker = { type: 'path', d: MARKER_FILLED_DIAMOND, fill: classEdgeStroke, stroke: classEdgeStroke };
                break;
            case 'aggregation':
                targetMarker = { type: 'path', d: MARKER_OPEN_ARROW_SMALL, fill: 'none', stroke: classEdgeStroke };
                sourceMarker = { type: 'path', d: MARKER_HOLLOW_DIAMOND, fill: data.theme.bg, stroke: classEdgeStroke };
                break;
            case 'dependency':
                targetMarker = { type: 'path', d: MARKER_OPEN_ARROW, fill: 'none', stroke: classEdgeStroke };
                strokeDasharray = DASHARRAY_DASHED;
                break;
            default:
                // association and any unknown kind / legacy docs
                targetMarker = { type: 'path', d: MARKER_OPEN_ARROW, fill: 'none', stroke: classEdgeStroke };
                break;
        }

        var lineAttrs = {
            stroke: classEdgeStroke,
            strokeWidth: classEdgeEvolution ? 3 : 1.5,
            strokeDasharray: edge.change === 'removed' ? '7 4' : strokeDasharray,
            targetMarker: targetMarker,
        };
        if (sourceMarker) { lineAttrs.sourceMarker = sourceMarker; }
        l.attr({ line: lineAttrs });

        if (edge.label) {
            l.labels([{
                attrs: {
                    text: { text: evolutionLabel(edge.label, edge), fill: classEdgeEvolution ? classEdgeEvolution.stroke : data.theme.fg, fontSize: 13 },
                    rect: { fill: data.theme.bg, rx: 3, ry: 3 },
                },
                position: 0.5,
            }]);
        }
        l.addTo(graph);
    }
}

function buildDiagram(doc, relayout) {
    pendingFit = true;
    pendingBuild = true;
    // Show overlay for large diagrams so the user knows rendering is in progress.
    if (doc.nodes && doc.nodes.length >= ASYNC_RENDER.overlayMinNodes) {
        // Local re-layout — nothing running server-side to cancel, so hide the button.
        genOverlayMsg.textContent = 'Rendering diagram…';
        if (genCancelBtn) { genCancelBtn.style.display = 'none'; }
        genOverlay.classList.add('visible');
    }
    if (doc.type === 'sequence') {
        buildSequence(doc, relayout);
    } else if (doc.type === 'class' || doc.type === 'er') {
        buildClass(doc, relayout);
    } else {
        // overview, architecture, flow, dataflow, state — all node+edge graphs
        buildArchitecture(doc, relayout);
    }
}

function attachEditTools() {
    if (!editMode) return;
    // Clear any existing tools first so repeated calls don't stack duplicates.
    graph.getElements().forEach(function(el) {
        var v = paper.findViewByModel(el);
        if (v) { v.removeTools(); }
    });
    graph.getLinks().forEach(function(link) {
        var v = paper.findViewByModel(link);
        if (v) { v.removeTools(); }
    });
    // Node tools: Remove button + Connect handle
    graph.getElements().forEach(function(el) {
        var elView = paper.findViewByModel(el);
        if (!elView) return;
        // Skip lifeline/sequence internals and group containers (not editable cells)
        if (el.prop('seqLifeline')) return;
        if (el.prop('isGroup') || el.prop('isGroupLabel')) return;
        var cell = el;
        var removeBtn = new joint.elementTools.Remove({
            x: '100%',
            y: 0,
            offset: { x: -6, y: 6 },
            action: function(evt, view) {
                host.postMessage({ type: 'deleteNode', id: view.model.id });
            },
        });
        var connectHandle = new joint.elementTools.Button({
            markup: [{
                tagName: 'circle',
                selector: 'button',
                attributes: { r: 7, fill: '#07E5DB', stroke: '#012624', 'stroke-width': 1.5, cursor: 'crosshair' },
            }],
            x: '100%',
            y: '50%',
            offset: { x: 6, y: 0 },
            action: function() {
                var link = new joint.shapes.standard.Link({
                    source: { id: cell.id },
                    target: { x: 0, y: 0 },
                });
                link.addTo(graph);
                var lv = link.findView(paper);
                if (lv) { lv.startArrowheadMove('target'); }
            },
        });
        elView.addTools(new joint.dia.ToolsView({ tools: [removeBtn, connectHandle] }));
    });
    // Link tools: Remove + TargetArrowhead for reconnect
    graph.getLinks().forEach(function(link) {
        if (link.prop('seqMessage')) return; // leave sequence messages alone
        var linkView = paper.findViewByModel(link);
        if (!linkView) return;
        var edgeIdx = link.get('edgeIndex');
        var removeTool = new joint.linkTools.Remove({
            action: function() {
                if (edgeIdx !== undefined) {
                    host.postMessage({ type: 'deleteEdge', index: edgeIdx });
                }
            },
        });
        var targetArrow = new joint.linkTools.TargetArrowhead();
        linkView.addTools(new joint.dia.ToolsView({ tools: [removeTool, targetArrow] }));
    });
}

// sequence actor y-lock
graph.on('change:position', function(cell) {
    if (currentDoc.type !== 'sequence') return;
    if (!cell.prop('seqActor')) return;
    var actorNode = null;
    for (var i = 0; i < currentDoc.nodes.length; i++) {
        if (currentDoc.nodes[i].id === cell.id) { actorNode = currentDoc.nodes[i]; break; }
    }
    if (!actorNode) return;
    var pos = cell.position();
    if (pos.y !== actorNode.y) {
        cell.position(pos.x, actorNode.y, { silent: true });
    }
    var ll = graph.getCell(cell.id + '_ll');
    if (ll) {
        ll.position(pos.x - 1, actorNode.y + 60, { silent: true });
    }
});

// ---- side panel ----

// Comment-list HTML (existing notes + the add-comment box) shared by the node,
// group, and diagram-note panel branches — the CRUD messages are cellId-agnostic
// (see annotations.ts), so this same markup/wiring serves all three.
function commentsSectionHtml(cellId) {
    var comments = currentDoc.comments[cellId] || [];
    var html = '';
    for (var ci = 0; ci < comments.length; ci++) {
        var c = comments[ci];
        html += '<div class="comment">';
        html += '<div class="meta">' + new Date(c.ts).toLocaleString() + '</div>';
        html += '<div class="cmt-text" data-cell="' + esc(cellId) + '" data-note="' + esc(c.id) + '">' + renderMarkdown(c.text) + '</div>';
        if (data.readOnly !== true) {
            html += '<button class="cmt-edit-btn" data-cell="' + esc(cellId) + '" data-note="' + esc(c.id) + '" data-raw="' + esc(c.text) + '" title="Edit comment" style="font-size:calc(10px * var(--archi-text-scale));background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;cursor:pointer;margin-top:4px;margin-right:4px;">&#9998;</button>';
            html += '<span class="del-btn" data-cell="' + esc(cellId) + '" data-note="' + esc(c.id) + '">&times;</span>';
            html += '<input type="text" class="cmt-tag-input" data-cell="' + esc(cellId) + '" data-note="' + esc(c.id) + '" value="' + esc(c.tag || '') + '" placeholder="tag (e.g. #1)" style="width:90px;margin-top:4px;font-size:calc(11px * var(--archi-text-scale));background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;">';
        }
        html += '</div>';
    }
    if (data.readOnly !== true) {
        html += '<input type="text" id="tagbox" placeholder="Tag (optional, e.g. #1)" style="width:120px;margin-bottom:4px;">';
        html += '<textarea id="addbox" placeholder="Add a comment…"></textarea>';
        html += '<button id="addbtn">Add comment</button>';
    }
    return html;
}

// Wires the comment-list events (delete/tag/edit) and the add-comment button
// rendered by commentsSectionHtml() above, for whichever cellId is selected.
function wireCommentSection(panel, cellId) {
    panel.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            host.postMessage({
                type: 'deleteComment',
                cellId: btn.getAttribute('data-cell'),
                noteId: btn.getAttribute('data-note'),
            });
        });
    });
    panel.querySelectorAll('.cmt-tag-input').forEach(function(inp) {
        inp.addEventListener('change', function() {
            host.postMessage({ type: 'setCommentTag', cellId: inp.getAttribute('data-cell'), noteId: inp.getAttribute('data-note'), tag: inp.value.trim() });
        });
    });
    panel.querySelectorAll('.cmt-edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var cell = btn.getAttribute('data-cell');
            var note = btn.getAttribute('data-note');
            var raw = btn.getAttribute('data-raw') || '';
            // Find the rendered text div and replace with an inline textarea + save button
            var commentDiv = btn.parentNode;
            var textDiv = commentDiv ? commentDiv.querySelector('.cmt-text') : null;
            if (!textDiv) { return; }
            if (commentDiv.querySelector('.cmt-edit-area')) { return; } // already editing
            textDiv.style.display = 'none';
            btn.style.display = 'none';
            var area = document.createElement('textarea');
            area.className = 'cmt-edit-area';
            area.value = raw;
            area.style.cssText = 'width:100%;min-height:60px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px;font:inherit;font-size:calc(12px * var(--archi-text-scale));resize:vertical;margin-top:4px;';
            var saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save';
            saveBtn.style.cssText = 'margin-top:4px;background:var(--accent-grad);color:var(--accent-text);border:none;border-radius:6px;padding:4px 12px;font-size:calc(11px * var(--archi-text-scale));font-weight:600;cursor:pointer;';
            saveBtn.addEventListener('click', function() {
                var newText = area.value.trim();
                if (newText) {
                    host.postMessage({ type: 'setCommentText', cellId: cell, noteId: note, text: newText });
                }
            });
            if (commentDiv) {
                commentDiv.insertBefore(area, textDiv.nextSibling);
                commentDiv.insertBefore(saveBtn, area.nextSibling);
            }
        });
    });
    var addBtn = panel.querySelector('#addbtn');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            var box = document.getElementById('addbox');
            var text = box.value.trim();
            if (!text) return;
            var tagVal = document.getElementById('tagbox') ? document.getElementById('tagbox').value.trim() : '';
            host.postMessage({ type: 'saveComment', cellId: cellId, text: text, tag: tagVal || undefined });
            box.value = '';
        });
    }
}

function groupEditorRowHtml(group) {
    var memberCount = 0;
    for (var ni = 0; ni < currentDoc.nodes.length; ni++) {
        if (currentDoc.nodes[ni].group === group.id) { memberCount++; }
    }
    var memberLabel = memberCount === 1 ? '1 node' : memberCount + ' nodes';
    var html = '<div class="group-manager-row">';
    html += '<input class="group-name-input" data-group="' + esc(group.id) + '" value="' + esc(group.label) + '" aria-label="Group name">';
    html += '<span class="group-member-count">' + memberLabel + '</span>';
    html += '<button class="group-rename-btn" data-group="' + esc(group.id) + '">Save</button>';
    html += '<button class="group-delete-btn" data-group="' + esc(group.id) + '" data-label="' + esc(group.label) + '">Delete</button>';
    html += '</div>';
    return html;
}

function groupManagerHtml() {
    var html = '<div id="group-manager" class="edit-section">';
    html += '<div class="edit-label">Groups</div>';
    html += '<p class="group-manager-help">Create visual containers, then assign nodes from each node\'s Group field.</p>';
    if (!currentDoc.groups || currentDoc.groups.length === 0) {
        html += '<p class="group-manager-empty">No groups yet.</p>';
    } else {
        for (var gi = 0; gi < currentDoc.groups.length; gi++) {
            html += groupEditorRowHtml(currentDoc.groups[gi]);
        }
    }
    html += '<button class="edit-add-btn" id="add-group-btn">+ Add group…</button>';
    html += '</div>';
    return html;
}

function wireGroupManager(panel) {
    var addButton = panel.querySelector('#add-group-btn');
    if (addButton) {
        addButton.addEventListener('click', function() {
            var label = window.prompt('New group name:');
            if (!label || !label.trim()) { return; }
            host.postMessage({ type: 'addGroup', label: label.trim() });
        });
    }
    panel.querySelectorAll('.group-rename-btn').forEach(function(button) {
        button.addEventListener('click', function() {
            var groupId = button.getAttribute('data-group');
            var row = button.parentNode;
            var input = row ? row.querySelector('.group-name-input') : null;
            var label = input ? input.value.trim() : '';
            if (!groupId || !label) { return; }
            host.postMessage({ type: 'renameGroup', groupId: groupId, label: label });
        });
    });
    panel.querySelectorAll('.group-delete-btn').forEach(function(button) {
        button.addEventListener('click', function() {
            var groupId = button.getAttribute('data-group');
            var label = button.getAttribute('data-label') || groupId;
            if (!groupId) { return; }
            if (!window.confirm('Delete group "' + label + '"? Its nodes will become ungrouped.')) { return; }
            host.postMessage({ type: 'deleteGroup', groupId: groupId });
        });
    });
}

function renderPanel(cellId) {
    var panel = document.getElementById('panel');
    var selection = panelSelection(currentDoc, cellId, DIAGRAM_NOTE_KEY);

    if (selection.kind === 'none') {
        panel.innerHTML = '<p class="placeholder">Click a node for details, or the background for the diagram note.</p>';
        return;
    }

    if (selection.kind === 'diagram') {
        var nameEl = document.getElementById('diagram-name');
        var diagramHeading = 'Diagram note' + (nameEl ? ' — ' + esc(nameEl.textContent) : '');
        var diagramHtml = '<h2>' + diagramHeading + '</h2>';
        if (editMode && supportsGroupEditing(currentDoc.type)) {
            diagramHtml += groupManagerHtml();
        }
        panel.innerHTML = diagramHtml + commentsSectionHtml(cellId);
        wireGroupManager(panel);
        wireCommentSection(panel, cellId);
        return;
    }

    if (selection.kind === 'group') {
        var groupHtml = '<h2>Group: ' + esc(selection.group.label) + '</h2>';
        if (editMode && supportsGroupEditing(currentDoc.type)) {
            groupHtml += '<div id="group-manager" class="edit-section">';
            groupHtml += '<div class="edit-label">Edit group</div>';
            groupHtml += groupEditorRowHtml(selection.group);
            groupHtml += '</div>';
        }
        panel.innerHTML = groupHtml + commentsSectionHtml(cellId);
        wireGroupManager(panel);
        wireCommentSection(panel, cellId);
        return;
    }

    var node = selection.node;
    // Sequence message order (edit mode, shown at top of panel regardless of selected node)
    var html = '';
    if (editMode && currentDoc.type === 'sequence' && currentDoc.edges.length > 0) {
        html += '<div class="edit-section">';
        html += '<div class="edit-label">Message order</div>';
        html += '<ol class="seq-order-list">';
        for (var si = 0; si < currentDoc.edges.length; si++) {
            var se = currentDoc.edges[si];
            var seLabel = se.from + ' → ' + se.to + (se.label ? ': ' + se.label : '');
            html += '<li>';
            if (si > 0) {
                html += '<button class="seq-up-btn" data-idx="' + si + '">▲</button>';
            } else {
                html += '<button class="seq-up-btn" disabled>▲</button>';
            }
            if (si < currentDoc.edges.length - 1) {
                html += '<button class="seq-dn-btn" data-idx="' + si + '">▼</button>';
            } else {
                html += '<button class="seq-dn-btn" disabled>▼</button>';
            }
            html += ' ' + esc(seLabel);
            html += '</li>';
        }
        html += '</ol>';
        html += '</div>';
    }
    html += '<h2>' + esc(node.label) + '</h2>';
    var systemComponent = systemComponents.find(function(component) { return component.id === node.id; });
    if (systemComponent && systemComponent.bundle) {
        html += '<button class="edit-add-btn" id="open-component-btn" data-node="' + esc(node.id) + '">Open component diagrams →</button>';
    }
    for (var fi = 0; fi < (node.files || []).length; fi++) {
        var f = node.files[fi];
        html += '<div class="path">' + esc(f) + '</div>';
        html += '<span class="openbtn" data-path="' + esc(f) + '">Open file →</span>';
    }
    // --- edit fields (only in editMode) ---
    if (editMode) {
        // Files section: list each file with remove button + "Add file" button
        html += '<div class="edit-section">';
        html += '<div class="edit-label">Files</div>';
        for (var efi = 0; efi < (node.files || []).length; efi++) {
            (function(ef, idx) {
                html += '<div class="edit-file-row">';
                html += '<span class="edit-file-path">' + esc(ef) + '</span>';
                html += '<button class="edit-rm-btn" data-node="' + esc(node.id) + '" data-file-idx="' + idx + '">&times;</button>';
                html += '</div>';
            })(node.files[efi], efi);
        }
        html += '<button class="edit-add-btn" data-node="' + esc(node.id) + '" id="pick-files-btn">+ Add file…</button>';
        html += '</div>';

        // Group section: select + "New group…" option for group-capable diagrams.
        if (supportsGroupEditing(currentDoc.type)) {
            html += '<div class="edit-section">';
            html += '<div class="edit-label">Group</div>';
            html += '<select id="group-select" data-node="' + esc(node.id) + '">';
            html += '<option value="">(none)</option>';
            for (var gi = 0; gi < (currentDoc.groups || []).length; gi++) {
                var g = currentDoc.groups[gi];
                var sel = node.group === g.id ? ' selected' : '';
                html += '<option value="' + esc(g.id) + '"' + sel + '>' + esc(g.label) + '</option>';
            }
            html += '<option value="__new__">New group…</option>';
            html += '</select>';
            html += '</div>';
        }

        // Members section (class diagrams only)
        if (currentDoc.type === 'class') {
            html += '<div class="edit-section">';
            html += '<div class="edit-label">Members</div>';
            html += '<textarea id="members-box" data-node="' + esc(node.id) + '" rows="5" placeholder="+ run(): void\n- count: int">' + esc((node.members || []).join('\n')) + '</textarea>';
            html += '</div>';
        }

        // Step section: reading-order step (all diagram types)
        html += '<div class="edit-section">';
        html += '<div class="edit-label">Step</div>';
        html += '<input type="number" id="step-input" data-node="' + esc(node.id) + '" min="1" step="1"';
        html += ' style="width:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:calc(12px * var(--archi-text-scale));"';
        html += ' placeholder="(none)"';
        if (typeof node.step === 'number') { html += ' value="' + node.step + '"'; }
        html += '>';
        html += '</div>';

        // Add relationship section (architecture + class diagrams)
        if (currentDoc.type !== 'sequence') {
            html += '<div class="edit-section">';
            html += '<div class="edit-label">Add relationship</div>';
            html += '<select id="rel-target-select">';
            html += '<option value="">(select target…)</option>';
            for (var ri = 0; ri < currentDoc.nodes.length; ri++) {
                var rn = currentDoc.nodes[ri];
                if (rn.id === node.id) { continue; }
                html += '<option value="' + esc(rn.id) + '">' + esc(rn.label + ' — ' + rn.id) + '</option>';
            }
            html += '</select>';
            html += '<input type="text" id="rel-label-input" placeholder="Relationship label (optional)">';
            html += '<button id="rel-add-btn" data-node="' + esc(node.id) + '">Add</button>';
            html += '</div>';
        }
    }
    // ---- code threads for this node (explicit link OR file match) ----
    var nodeThreads = [];
    for (var ti = 0; ti < codeThreads.length; ti++) {
        var t = codeThreads[ti];
        if ((!t.diagramType || t.diagramType === data.activeType) && threadMatchesNode(t, node)) {
            nodeThreads.push(t);
        }
    }
    if (nodeThreads.length > 0) {
        html += '<div class="threads-header" style="font-size:calc(11px * var(--archi-text-scale));color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em;">Code threads</div>';
        for (var nti = 0; nti < nodeThreads.length; nti++) {
            var nt = nodeThreads[nti];
            var anchor = nt.anchored ? '' : ' <span class="thread-unanchored">(unanchored)</span>';
            var matchTag = nt.node === node.id
                ? ' <span class="thread-tag thread-linked">linked</span>'
                : ' <span class="thread-tag thread-auto">auto</span>';
            html += '<div class="thread-item" data-thread-id="' + esc(nt.id) + '">';
            html += '<div class="thread-loc">' + esc(nt.file) + ':' + nt.line + anchor + matchTag + '</div>';
            if (nt.snippet) {
                html += '<div class="thread-snippet">' + esc(nt.snippet) + '</div>';
            }
            var commentCount = nt.comments ? nt.comments.length : 0;
            if (commentCount > 0) {
                html += '<div class="thread-count">' + commentCount + ' comment' + (commentCount === 1 ? '' : 's') + '</div>';
                for (var tci = 0; tci < nt.comments.length; tci++) {
                    var tc = nt.comments[tci];
                    html += '<div class="thread-comment">';
                    html += '<div class="meta">' + new Date(tc.ts).toLocaleString() + '</div>';
                    html += renderMarkdown(tc.text);
                    html += '</div>';
                }
            }
            html += '<button class="reveal-code-btn" data-thread-id="' + esc(nt.id) + '">Reveal in code</button>';
            html += '</div>';
        }
    }
    html += commentsSectionHtml(cellId);
    panel.innerHTML = html;

    // --- edit field event wiring ---
    if (editMode) {
        // Remove-file buttons
        panel.querySelectorAll('.edit-rm-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var nid = btn.getAttribute('data-node');
                var idx = parseInt(btn.getAttribute('data-file-idx'), 10);
                var nodeForEdit = null;
                for (var i = 0; i < currentDoc.nodes.length; i++) {
                    if (currentDoc.nodes[i].id === nid) { nodeForEdit = currentDoc.nodes[i]; break; }
                }
                if (!nodeForEdit) return;
                var newFiles = (nodeForEdit.files || []).filter(function(_, i) { return i !== idx; });
                host.postMessage({ type: 'setNodeFiles', nodeId: nid, files: newFiles });
            });
        });

        // Pick files button
        var pickBtn = panel.querySelector('#pick-files-btn');
        if (pickBtn) {
            pickBtn.addEventListener('click', function() {
                var nid = pickBtn.getAttribute('data-node');
                host.postMessage({ type: 'pickFiles', nodeId: nid });
            });
        }

        // Group select
        var groupSel = panel.querySelector('#group-select');
        if (groupSel) {
            groupSel.addEventListener('change', function() {
                var nid = groupSel.getAttribute('data-node');
                var val = groupSel.value;
                if (val === '__new__') {
                    var label = window.prompt('New group name:');
                    if (!label || !label.trim()) { groupSel.value = node.group || ''; return; }
                    host.postMessage({ type: 'addGroupAndAssign', nodeId: nid, label: label.trim() });
                } else {
                    host.postMessage({ type: 'setNodeGroup', nodeId: nid, group: val || undefined });
                }
            });
        }

        // Step input (all diagram types)
        var stepInput = panel.querySelector('#step-input');
        if (stepInput) {
            stepInput.addEventListener('change', function() {
                var nid = stepInput.getAttribute('data-node');
                var raw = stepInput.value.trim();
                var stepVal = raw === '' ? null : parseInt(raw, 10);
                host.postMessage({ type: 'setNodeStep', nodeId: nid, step: stepVal });
            });
        }

        // Members textarea (class only)
        var membersBox = panel.querySelector('#members-box');
        if (membersBox) {
            membersBox.addEventListener('blur', function() {
                var nid = membersBox.getAttribute('data-node');
                var lines = membersBox.value.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
                host.postMessage({ type: 'setNodeMembers', nodeId: nid, members: lines });
            });
        }

        // Add-relationship button
        var relAddBtn = panel.querySelector('#rel-add-btn');
        if (relAddBtn) {
            relAddBtn.addEventListener('click', function() {
                var fromId = relAddBtn.getAttribute('data-node');
                var toSelect = panel.querySelector('#rel-target-select');
                var toId = toSelect ? toSelect.value : '';
                if (!toId) { return; }
                var labelInput = panel.querySelector('#rel-label-input');
                var labelText = labelInput ? labelInput.value.trim() : '';
                host.postMessage({ type: 'addEdge', from: fromId, to: toId, label: labelText || undefined });
                if (toSelect) { toSelect.value = ''; }
                if (labelInput) { labelInput.value = ''; }
            });
        }
    }

    // Sequence order buttons (always wire when present, they only appear in editMode)
    panel.querySelectorAll('.seq-up-btn').forEach(function(btn) {
        if (btn.disabled) return;
        btn.addEventListener('click', function() {
            var idx = parseInt(btn.getAttribute('data-idx'), 10);
            host.postMessage({ type: 'moveEdge', fromIndex: idx, toIndex: idx - 1 });
        });
    });
    panel.querySelectorAll('.seq-dn-btn').forEach(function(btn) {
        if (btn.disabled) return;
        btn.addEventListener('click', function() {
            var idx = parseInt(btn.getAttribute('data-idx'), 10);
            host.postMessage({ type: 'moveEdge', fromIndex: idx, toIndex: idx + 1 });
        });
    });

    panel.querySelectorAll('.openbtn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            host.postMessage({ type: 'openFile', path: btn.getAttribute('data-path') });
        });
    });
    var openComponentBtn = panel.querySelector('#open-component-btn');
    if (openComponentBtn) {
        openComponentBtn.addEventListener('click', function() {
            host.postMessage({ type: 'openComponentBundle', nodeId: openComponentBtn.getAttribute('data-node') });
        });
    }
    panel.querySelectorAll('.reveal-code-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            host.postMessage({ type: 'openCodeThread', threadId: btn.getAttribute('data-thread-id') });
        });
    });
    wireCommentSection(panel, cellId);
}

// ---- design panel ----

function methodDescription(method) {
    if (method.kind === 'manual') { return 'Manual'; }
    if (method.kind === 'claude') { return 'Claude critic'; }
    return 'Command';
}

function criterionCommandHtml(method) {
    if (method.kind !== 'command') { return ''; }
    var parts = [method.executable].concat(method.args || []);
    var cmdText = parts.map(esc).join(' ');
    var cwdText = method.cwd ? ' (in ' + esc(method.cwd) + ')' : '';
    return '<div class="criterion-command">' + cmdText + cwdText + '</div>';
}

function renderDesignBriefHtml(vm, readOnly) {
    var html = '<div class="design-brief" data-design-id="' + esc(vm.id) + '">';
    html += '<h2>' + esc(vm.name) + '<span class="design-status status-' + esc(vm.status) + '">' + esc(vm.status) + '</span></h2>';
    if (vm.isUnconfirmed) {
        html += '<div class="design-unconfirmed-banner">'
            + '<span>Unconfirmed &mdash; reconstructed from code, not yet reviewed.</span>';
        if (readOnly !== true) {
            html += '<button class="design-confirm-goal-btn" data-design-id="' + esc(vm.id) + '">Confirm goal</button>';
        }
        html += '</div>';
    }
    html += '<div class="design-goal">' + esc(vm.goal) + '</div>';
    for (var si = 0; si < vm.sections.length; si++) {
        var section = vm.sections[si];
        html += '<div class="design-section"><div class="design-section-label">' + esc(section.label) + '</div><ul>';
        for (var ii = 0; ii < section.items.length; ii++) {
            html += '<li>' + esc(section.items[ii]) + '</li>';
        }
        html += '</ul></div>';
    }
    if (vm.decisions.length > 0) {
        html += '<div class="design-section"><div class="design-section-label">Decisions</div>';
        for (var di = 0; di < vm.decisions.length; di++) {
            var decision = vm.decisions[di];
            html += '<div class="decision">' + esc(decision.text);
            if (decision.rationale) { html += '<div class="decision-rationale">' + esc(decision.rationale) + '</div>'; }
            html += '</div>';
        }
        html += '</div>';
    }
    if (vm.plan.length > 0) {
        html += '<div class="design-section"><div class="design-section-label">Plan</div>';
        for (var pi = 0; pi < vm.plan.length; pi++) {
            var step = vm.plan[pi];
            html += '<div class="plan-step"><div>' + (pi + 1) + '. ' + esc(step.text) + '</div>';
            if (step.targets.length > 0) {
                html += '<div class="plan-step-targets">' + step.targets.map(esc).join(', ') + '</div>';
            }
            if (step.nodeIds.length > 0) {
                html += '<div>';
                for (var ni = 0; ni < step.nodeIds.length; ni++) {
                    html += '<span class="plan-node-link" data-node-id="' + esc(step.nodeIds[ni]) + '">' + esc(step.nodeIds[ni]) + '</span>';
                }
                html += '</div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    html += '<div class="design-section"><div class="design-section-label">Acceptance criteria</div>';
    for (var ci = 0; ci < vm.criteria.length; ci++) {
        var criterion = vm.criteria[ci];
        var statusClass = criterion.latestStatus.replace(/s+/g, '-');
        html += '<div class="criterion" data-criterion-id="' + esc(criterion.id) + '">';
        html += '<div>' + esc(criterion.text) + '<span class="criterion-status status-' + esc(statusClass) + '">' + esc(criterion.latestStatus) + '</span></div>';
        html += '<div class="design-section-label">' + methodDescription(criterion.method) + '</div>';
        html += criterionCommandHtml(criterion.method);
        if (criterion.latestSummary) { html += '<div class="decision-rationale">' + esc(criterion.latestSummary) + '</div>'; }
        if (criterion.method.kind === 'command' && readOnly !== true) {
            html += '<button class="criterion-run-btn" data-design-id="' + esc(vm.id) + '" data-criterion-id="' + esc(criterion.id) + '">Run</button>';
        }
        html += '</div>';
    }
    html += '</div>';
    html += '<div class="design-summary">' + vm.passingCount + ' of ' + vm.totalCount + ' criteria passing</div>';
    if (readOnly !== true) {
        html += '<button class="design-verify-all-btn" data-design-id="' + esc(vm.id) + '">Verify all</button>';
    }
    html += '</div>';
    return html;
}

function wireDesignPanel(el) {
    el.querySelectorAll('.plan-node-link').forEach(function(link) {
        link.addEventListener('click', function() {
            // Reuse the same select-and-centre mechanism the host uses to jump to a
            // node (see the 'selectNode' branch in the message listener below) — do

                type: 'runDesignCriterion',

            });
        });

    el.querySelectorAll('.design-verify-all-btn').forEach(function(btn) {

            host.postMessage({ type: 'verifyAllDesignCriteria', designId: btn.getAttribute('data-design-id') });
        });

function renderDesignPanel() {
    var el = document.getElementById('design-panel');

        return;
    }
    var vms = buildDesignsViewModel(designs);
    var html = '';
    for (var vi = 0; vi < vms.length; vi++) { html += renderDesignBriefHtml(vms[vi], data.readOnly === true); }
    el.innerHTML = html;

var sideTabSelectionBtn = document.getElementById('side-tab-selection');
var sideTabDesignBtn = document.getElementById('side-tab-design');
function showSideTab(tab) {
    var panelEl = document.getElementById('panel');
    var designPanelEl = document.getElementById('design-panel');
    if (!panelEl || !designPanelEl) { return; }
    if (tab === 'design') {
        panelEl.style.display = 'none';
        designPanelEl.style.display = '';
        renderDesignPanel();
        if (sideTabDesignBtn) { sideTabDesignBtn.classList.add('active'); }
        if (sideTabSelectionBtn) { sideTabSelectionBtn.classList.remove('active'); }
    } else {
        panelEl.style.display = '';
        designPanelEl.style.display = 'none';
        if (sideTabSelectionBtn) { sideTabSelectionBtn.classList.add('active'); }
        if (sideTabDesignBtn) { sideTabDesignBtn.classList.remove('active'); }
    }
}
function wireSideTabButtons() {
    if (sideTabSelectionBtn) {
        sideTabSelectionBtn.addEventListener('click', function() { showSideTab('selection'); });
    }
    if (sideTabDesignBtn) {
        sideTabDesignBtn.addEventListener('click', function() {
            expandSidePanel();
            showSideTab('design');
        });
    }
}
wireSideTabButtons();

// The tab row (#side-tabs, holding Selection/Design) is server-rendered only when the
// bundle already had designs[] at open time. A bundle can gain its FIRST design
// mid-session (e.g. the architecture-grill skill just wrote one) — build the row
// on demand the first time designs[] becomes non-empty, so the tab doesn't stay
// hidden until the diagram is reopened. Called from applyDesignsUpdate, the single
// place designs[] changes reach the client (both 'refresh' and 'loadDiagram' route
// through it) — the same pattern refreshEvolutionLegend() uses to rebuild legend
// state inside the loadDiagram handler, rather than inventing a second mechanism.
function ensureSideTabs() {
    if (designs.length === 0 || document.getElementById('side-tabs')) { return; }
    var side = document.getElementById('side');
    var panelEl = document.getElementById('panel');
    if (!side || !panelEl) { return; }
    var tabs = document.createElement('div');
    tabs.id = 'side-tabs';
    tabs.innerHTML = '<button id="side-tab-selection" class="side-tab active" data-side-tab="selection">Selection</button>' +
        '<button id="side-tab-design" class="side-tab" data-side-tab="design">Design</button>';
    side.insertBefore(tabs, panelEl);
    sideTabSelectionBtn = document.getElementById('side-tab-selection');
    sideTabDesignBtn = document.getElementById('side-tab-design');
    wireSideTabButtons();
}

// Applies a fresh designs[] pushed from the host (after a save or a criterion
// run) and re-renders the Design tab only if it's the one currently visible.
function applyDesignsUpdate(newDesigns) {
    designs = newDesigns;
    data.designs = designs;
    ensureSideTabs();
    refreshRegenerateButton();
    var el = document.getElementById('design-panel');
    if (el && el.style.display !== 'none') { renderDesignPanel(); }

var selectedCellId = null;
paper.on('element:pointerup', function(cellView) {
    if (cellView.model.prop('isGroup')) return;
    var el = cellView.model;
    if (el.prop('isGroupLabel')) {
        if (!editMode) return;
        var groupId = el.prop('groupId');
        var pos = el.position();
        var size = el.size();
        var groupX = el.prop('groupBoxX');
        var groupY = el.prop('groupBoxY');
        var maxX = Math.max(GROUP_LABEL.inset, el.prop('groupBoxWidth') - size.width - GROUP_LABEL.inset);
        var maxY = Math.max(GROUP_LABEL.inset, el.prop('groupBoxHeight') - size.height - GROUP_LABEL.inset);
        var offsetX = clamp(pos.x - groupX, GROUP_LABEL.inset, maxX);
        var offsetY = clamp(pos.y - groupY, GROUP_LABEL.inset, maxY);
        el.position(groupX + offsetX, groupY + offsetY, { silent: true });
        for (var gi = 0; gi < currentDoc.groups.length; gi++) {
            if (currentDoc.groups[gi].id === groupId) {
                currentDoc.groups[gi].labelPosition = { x: offsetX, y: offsetY };
                break;
            }
        }
        selectedCellId = groupId;
        host.postMessage({ type: 'setGroupLabelPosition', groupId: groupId, x: offsetX, y: offsetY });
        renderPanel(groupId);
        return;
    }
    selectedCellId = el.id;
    var pos = el.position();
    host.postMessage({ type: 'setPosition', nodeId: el.id, x: pos.x, y: pos.y });
    renderPanel(el.id);
});

paper.on('element:pointerclick', function(cellView) {
    // Reveal the panel on click — otherwise, with the panel collapsed by default,
    // clicking a node to inspect it silently updates hidden content (no feedback).
    expandSidePanel();
    if (cellView.model.prop('isGroup') || cellView.model.prop('isGroupLabel')) {
        selectedCellId = cellView.model.prop('groupId');
        renderPanel(cellView.model.prop('groupId'));
        return;
    }
    selectedCellId = cellView.model.id;
    renderPanel(cellView.model.id);
});

paper.on('blank:pointerclick', function() {
    selectedCellId = DIAGRAM_NOTE_KEY;
    renderPanel(DIAGRAM_NOTE_KEY);
});

paper.on('blank:pointerdblclick', function(evt, x, y) {
    if (!editMode) return;
    beginAddNode(evt, x, y);
});

paper.on('element:pointerdblclick', function(cellView) {
    if (cellView.model.prop('isGroup') || cellView.model.prop('isGroupLabel')) return;
    var el = cellView.model;
    var nodeId = el.id;

    // Always expand the side panel and select the node

});

// ---- overlays ----
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Inline input overlay for rename/add-node. Positions an <input> at (x,y) on the
// canvas. onCommit(value|null) fires on Enter/blur; null means Esc/cancel.
function showInlineInput(initialValue, x, y, rect, onCommit) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = initialValue;
    inp.style.cssText = [
        'position:absolute',
        'z-index:4000',
        'background:' + data.theme.panel,
        'color:' + data.theme.fg,
        'border:1px solid ' + data.theme.accent,
        'border-radius:4px',
        'padding:2px 6px',
        'font:12px system-ui,sans-serif',
        'outline:none',
        'left:' + (rect ? rect.x : x) + 'px',
        'top:' + (rect ? rect.y : y) + 'px',
        rect ? 'width:' + Math.max(120, rect.w) + 'px' : 'width:140px',
    ].join(';');
    var committed = false;
    function commit(val) {
        if (committed) return;
        committed = true;
        if (inp.parentNode) inp.parentNode.removeChild(inp);
        onCommit(val);
    }
    inp.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); commit(inp.value.trim() || null); }
        else if (ev.key === 'Escape') { ev.preventDefault(); commit(null); }
    });
    inp.addEventListener('blur', function() { commit(inp.value.trim() || null); });
    cyWrap.appendChild(inp);
    inp.focus();
    inp.select();
}

// JointJS blank events provide x/y in diagram model space. Inline HTML controls
// live in #cy-wrap screen space, so using model coordinates as CSS coordinates
// can place an input thousands of pixels away when the diagram is fitted/zoomed.
function pointInWrap(evt, modelX, modelY) {
    var wrapRect = cyWrap.getBoundingClientRect();
    var clientX = evt && Number.isFinite(evt.clientX) ? evt.clientX : null;
    var clientY = evt && Number.isFinite(evt.clientY) ? evt.clientY : null;
    if (clientX === null || clientY === null) {
        var clientPoint = paper.localToClientPoint({ x: modelX, y: modelY });
        clientX = clientPoint.x;
        clientY = clientPoint.y;
    }
    // Keep the 140px input inside the visible canvas even at its right/bottom edge.
    return {
        x: clamp(clientX - wrapRect.left, 0, Math.max(0, wrapRect.width - 160)),
        y: clamp(clientY - wrapRect.top, 0, Math.max(0, wrapRect.height - 34)),
    };
}

function beginAddNode(evt, modelX, modelY) {
    var screenPoint = pointInWrap(evt, modelX, modelY);
    showInlineInput('', screenPoint.x, screenPoint.y, null, function(label) {
        if (!label) return;
        host.postMessage({ type: 'addNode', label: label, x: modelX - 85, y: modelY - 22 });
    });
}

function beginAddNodeAtCanvasCenter() {
    var rect = cyWrap.getBoundingClientRect();
    var clientX = rect.left + (rect.width / 2);
    var clientY = rect.top + (rect.height / 2);
    var modelPoint = paper.clientToLocalPoint({ x: clientX, y: clientY });
    beginAddNode({ clientX: clientX, clientY: clientY }, modelPoint.x, modelPoint.y);
}

function beginRenameNode(nodeId) {
    var node = null;
    for (var i = 0; i < currentDoc.nodes.length; i++) {
        if (currentDoc.nodes[i].id === nodeId) { node = currentDoc.nodes[i]; break; }
    }
    if (!node) return;
    var r = viewRect(nodeId);
    if (!r) return;
    showInlineInput(node.label, r.x, r.y, r, function(label) {
        if (label === null || label === node.label) return;
        host.postMessage({ type: 'renameNode', id: nodeId, label: label });
    });
}

function beginEditEdgeLabel(edgeIdx, evt) {
    var edge = currentDoc.edges[edgeIdx];
    var existingLabel = edge && edge.label ? edge.label : '';
    var r = cyWrap.getBoundingClientRect();
    var ox = evt.clientX - r.left;
    var oy = evt.clientY - r.top;
    showInlineInput(existingLabel, ox, oy, null, function(label) {
        if (label === null) return;
        host.postMessage({ type: 'updateEdge', index: edgeIdx, patch: { label: label } });
    });
}

function viewRect(cellId) {
    var el = cyDiv.querySelector('[model-id="' + cellId + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    var c = cyWrap.getBoundingClientRect();
    if (!r.width && !r.height) return null;
    return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height };
}

function positionOverlays() {
    overlay.innerHTML = '';
    // ---- comment + step badges: iterate nodes to handle both step and comment badges ----
    for (var oi = 0; oi < currentDoc.nodes.length; oi++) {
        var oNode = currentDoc.nodes[oi];
        var oList = currentDoc.comments[oNode.id];
        var oHasComments = oList && oList.length > 0;
        var oHasStep = typeof oNode.step === 'number';
        if (!oHasComments && !oHasStep) { continue; }
        var or = viewRect(oNode.id);
        if (!or) { continue; }
        (function(nodeId, commentList, rect, nodeStep) {
            var hasComments = commentList && commentList.length > 0;
            var badge = document.createElement('div');
            badge.className = 'cmt-badge';
            // step is top priority over tagged comment
            if (typeof nodeStep === 'number') {
                badge.textContent = '#' + nodeStep;
            } else if (hasComments) {
                badge.textContent = commentList[0] && commentList[0].tag ? commentList[0].tag : ((expanded.has(nodeId) ? '▾ ' : '💬 ') + commentList.length);
            }
            badge.style.left = (rect.x + rect.w) + 'px';
            badge.style.top = rect.y + 'px';
            badge.addEventListener('click', function(ev) {
                ev.stopPropagation();
                if (expanded.has(nodeId)) { expanded.delete(nodeId); } else { expanded.add(nodeId); }
                positionOverlays();
            });
            overlay.appendChild(badge);
            if (hasComments && expanded.has(nodeId)) {
                var bub = document.createElement('div');
                bub.className = 'cmt-bubble';
                bub.style.left = (rect.x + rect.w + 6) + 'px';
                bub.style.top = (rect.y + 6) + 'px';
                var savedSize = bubbleSizes[nodeId];
                if (savedSize) {
                    bub.style.width = savedSize.w + 'px';
                    bub.style.height = savedSize.h + 'px';
                }
                // Render the node's own comments via renderMarkdown
                var bubHtml = commentList.map(function(c) {
                    return '<div class="cmt"><div class="meta">' + new Date(c.ts).toLocaleString() + '</div>' + renderMarkdown(c.text) + '</div>';
                }).join('');
                // Append code-thread comments linked to this node (read-only, labelled with 📎 file:line)
                for (var bi = 0; bi < codeThreads.length; bi++) {
                    var bt = codeThreads[bi];
                    if ((!bt.diagramType || bt.diagramType === data.activeType) && threadMatchesNode(bt, { id: nodeId, files: [] })) {
                        for (var bj = 0; bj < (bt.comments || []).length; bj++) {
                            var btc = bt.comments[bj];
                            bubHtml += '<div class="cmt cmt-thread"><div class="meta">&#128206; ' + esc(bt.file) + ':' + bt.line + ' &middot; ' + new Date(btc.ts).toLocaleString() + '</div>' + renderMarkdown(btc.text) + '</div>';
                        }
                    }
                }
                bub.innerHTML = bubHtml;
                // Persist a manual drag-resize so it survives the next positionOverlays() rebuild.
                bub.addEventListener('mouseup', (function(nid, el) {
                    return function() { bubbleSizes[nid] = { w: el.offsetWidth, h: el.offsetHeight }; };
                })(nodeId, bub));
                overlay.appendChild(bub);
            }
        })(oNode.id, oList || [], or, oNode.step);
    }
    // ---- 📎 code-thread markers ----
    for (var ni = 0; ni < currentDoc.nodes.length; ni++) {
        var node = currentDoc.nodes[ni];
        var hasThread = false;
        for (var ti = 0; ti < codeThreads.length; ti++) {
            if ((!codeThreads[ti].diagramType || codeThreads[ti].diagramType === data.activeType) && threadMatchesNode(codeThreads[ti], node)) {
                hasThread = true;
                break;
            }
        }
        if (!hasThread) continue;
        var nr = viewRect(node.id);
        if (!nr) continue;
        (function(rect) {
            var marker = document.createElement('div');
            marker.className = 'code-thread-badge';
            marker.textContent = '📎';
            marker.style.left = (rect.x + rect.w) + 'px';
            marker.style.top = (rect.y + rect.h - 6) + 'px';
            overlay.appendChild(marker);
        })(nr);
    }
    // Update tour button visibility based on whether any nodes have a step
    var tourBtn = document.getElementById('tour-btn');
    if (tourBtn) {
        tourBtn.style.display = tourNodes.length > 0 ? '' : 'none';
    }
}

var isPanning = false;
var panLastX = 0;
var panLastY = 0;

// Pan when grabbing anywhere that isn't a draggable node (blank paper OR the
// empty container area around the diagram). Nodes still drag normally.
cyScroll.addEventListener('mousedown', function(evt) {
    if (evt.button !== 0) return;
    if (evt.target.closest && evt.target.closest('.joint-cell')) return;
    isPanning = true;
    panLastX = evt.clientX;
    panLastY = evt.clientY;
    cyScroll.classList.add('panning');
});

document.addEventListener('mousemove', function(evt) {
    if (!isPanning) return;
    var dx = evt.clientX - panLastX;
    var dy = evt.clientY - panLastY;
    panLastX = evt.clientX;
    panLastY = evt.clientY;
    cyScroll.scrollLeft -= dx;
    cyScroll.scrollTop -= dy;
});

    if (!isPanning) return;
    isPanning = false;

function showContextMenu(x, y, items) {
    removeContextMenu();

    menu.id = CONTEXT_MENU_ID;
    menu.style.cssText = [

    items.forEach(function(spec) {

        item.addEventListener('mouseenter', function() { item.style.background = data.theme.border; });
