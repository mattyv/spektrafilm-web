// ---- zoom ----
var scale = 1;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function cacheCurrentViewport() {
    if (!data.activeId || pendingFit) return;
    viewportByDiagram[data.activeId] = {
        scale: scale,
        scrollLeft: cyScroll.scrollLeft,
        scrollTop: cyScroll.scrollTop,
    };
}

function restoreViewport(viewport) {
    scale = clamp(viewport.scale, LAYOUT.zoomMin, LAYOUT.zoomMax);
    paper.scale(renderedDiagramScale(scale, textScale));
    fitContent();
    cyScroll.scrollLeft = viewport.scrollLeft;
    cyScroll.scrollTop = viewport.scrollTop;
    positionOverlays();
}

function applyZoom(newScale, pivotX, pivotY) {
    var oldScale = scale;
    scale = clamp(newScale, LAYOUT.zoomMin, LAYOUT.zoomMax);
    paper.scale(renderedDiagramScale(scale, textScale));
    fitContent();
    if (pivotX !== undefined && pivotY !== undefined) {
        var ratio = scale / oldScale;
        cyScroll.scrollLeft = (cyScroll.scrollLeft + pivotX) * ratio - pivotX;
        cyScroll.scrollTop  = (cyScroll.scrollTop  + pivotY) * ratio - pivotY;
    }
    positionOverlays();
}

cyScroll.addEventListener('wheel', function(e) {
    if (!(e.ctrlKey || e.metaKey)) return; // plain wheel = scroll; Ctrl/Cmd+wheel = zoom
    e.preventDefault();
    var rect = cyScroll.getBoundingClientRect();
    var pivotX = e.clientX - rect.left;
    var pivotY = e.clientY - rect.top;
    var newScale = scale * (e.deltaY < 0 ? LAYOUT.wheelIn : LAYOUT.wheelOut);
    applyZoom(newScale, pivotX, pivotY);
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', function() { applyZoom(scale * LAYOUT.btnStep); });
document.getElementById('zoom-out').addEventListener('click', function() { applyZoom(scale / LAYOUT.btnStep); });
function updateTextScale(nextScale) {
    var oldTextScale = textScale;
    textScale = normalizeTextScale(nextScale);
    if (textScale === oldTextScale) { return; }
    document.documentElement.style.setProperty('--archi-text-scale', String(textScale));
    paper.scale(renderedDiagramScale(scale, textScale));
    fitContent();
    var ratio = textScale / oldTextScale;
    var pivotX = cyScroll.clientWidth / 2;
    var pivotY = cyScroll.clientHeight / 2;
    cyScroll.scrollLeft = (cyScroll.scrollLeft + pivotX) * ratio - pivotX;
    cyScroll.scrollTop = (cyScroll.scrollTop + pivotY) * ratio - pivotY;
    persistHostState({ textScale: textScale });
    positionOverlays();
}
document.getElementById('text-larger').addEventListener('click', function() { updateTextScale(stepTextScale(textScale, 1)); });
document.getElementById('text-smaller').addEventListener('click', function() { updateTextScale(stepTextScale(textScale, -1)); });
function fitToViewport() {
    var bbox = graph.getBBox();
    if (!bbox) return;
    var vw = cyScroll.clientWidth - LAYOUT.fitMargin;
    var vh = cyScroll.clientHeight - LAYOUT.fitMargin;
    var fitScale = clamp(Math.min(vw / bbox.width, vh / bbox.height), LAYOUT.zoomMin, LAYOUT.zoomMax);
    scale = fitScale;
    paper.scale(renderedDiagramScale(scale, textScale));
    fitContent();
    cyScroll.scrollLeft = 0;
    cyScroll.scrollTop = 0;
    positionOverlays();
}

// Fit = zoom the current layout to the viewport. Auto-layout = re-flow the graph
// for the current viewport (TB/LR by aspect), then fit.
function persistCurrentLayout() {
    currentDoc.autoLayoutApplied = true;
    host.postMessage({
        type: 'setPositions',
        positions: currentDoc.nodes.map(function(n) { return { id: n.id, x: n.x, y: n.y }; }),
        edgeLayouts: serializableEdgeLayouts(),
        groupLabelPositions: currentDoc.groups.filter(function(group) {
            return group.labelPosition && isFinite(group.labelPosition.x) && isFinite(group.labelPosition.y);
        }).map(function(group) {
            return { id: group.id, x: group.labelPosition.x, y: group.labelPosition.y };
        }),
    });
}

// True when every node sits at the shared (0,0) origin — the signature of a
// diagram whose x/y were omitted (and defaulted to 0 by annotations.ts) rather
// than genuinely laid out. A real layout (client or server dagre) essentially
// never places 2+ nodes exactly on top of each other, so this is a safe signal.
function allNodesAtOrigin(doc) {
    return doc.nodes.length > 1 && doc.nodes.every(function(n) { return (n.x || 0) === 0 && (n.y || 0) === 0; });
}

function needsAutomaticLayout(doc) {
    if (!doc || !doc.nodes || doc.nodes.length === 0) return false;
    if (doc.autoLayoutApplied === true) return false;
    // class/er/sequence read stored coordinates directly instead of always
    // auto-flowing on open (their client dagre pass would otherwise clobber a
    // deliberately-computed server layout — see the zoom-layout handler below).
    // But if coordinates were never set, fall back to auto-layout so the
    // diagram doesn't render as a stack of overlapping nodes at the origin.
    if (doc.type === 'class' || doc.type === 'er' || doc.type === 'sequence') {
        return allNodesAtOrigin(doc);
    }
    return true;
}

function buildLoadedDiagram() {
    var auto = needsAutomaticLayout(currentDoc);
    buildDiagram(currentDoc, auto);
    if (auto) { persistCurrentLayout(); }
}

document.getElementById('zoom-fit').addEventListener('click', function() { fitToViewport(); });
document.getElementById('zoom-layout').addEventListener('click', function() {
    // For class/ER diagrams, delegate to the canonical server-side layout engine via
    // a 'relayoutClass' message. The extension handles the QuickPick mode picker,
    // runs layoutClassGraph, saves the new positions, and posts loadDiagram back.
    // This prevents the wide client-side dagre layout from overwriting the good server layout.
    if (currentDoc.type === 'class' || currentDoc.type === 'er') {
        host.postMessage({ type: 'relayoutClass' });
        return;
    }
    // For all other types (overview, architecture, flow, state, dataflow, sequence), keep the
    // existing client-side auto-layout behaviour.
    buildDiagram(currentDoc, true);
    // fitToViewport() is now called via render:done (pendingFit flag) — do not call it here.
    // persist the new positions so the layout survives tab switches / reloads
    persistCurrentLayout();
});
document.getElementById('zoom-export-png').addEventListener('click', exportPng);

// ---- messages ----
window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'refresh') {
        currentDoc = Object.assign({}, currentDoc, { comments: e.data.doc.comments });
        data.doc = currentDoc;
        if (e.data.codeThreads !== undefined) {
            codeThreads = e.data.codeThreads;
            data.codeThreads = codeThreads;
        }
        if (e.data.designs !== undefined) { applyDesignsUpdate(e.data.designs); }
        rerenderComments();
    } else if (e.data.type === 'loadDiagram') {
        // Preserve an active tour across a same-diagram reload (e.g. the LLM writing a
        // comment to disk triggers a reload). A genuine diagram switch (different activeId)
        // still ends the tour. Capture state BEFORE we overwrite data.activeId below.
        var wasTouring = tourActive;
        var sameDiagram = e.data.activeId === data.activeId;
        var prevTourNodeId = (wasTouring && tourNodes[tourIndex]) ? tourNodes[tourIndex].id : null;
        cacheCurrentViewport();
        pendingViewportRestore = viewportByDiagram[e.data.activeId] || null;

        currentDoc = e.data.doc;
        data.doc = currentDoc;
        data.activeType = e.data.activeType;
        data.activeId = e.data.activeId;
        data.typesPresent = e.data.typesPresent;
        data.diagramsOfActiveType = e.data.diagramsOfActiveType;
        if (e.data.codeThreads !== undefined) {
            codeThreads = e.data.codeThreads;
            data.codeThreads = codeThreads;
        }
        if (e.data.designs !== undefined) { applyDesignsUpdate(e.data.designs); }
        // Clear the "generating…" overlay FIRST so a build error can't leave it stuck.
        genOverlay.classList.remove('visible');
        try {
            findClear();
            buildLoadedDiagram();
            if (currentDoc.nodes.length === 0) { showEmptyState(); } else { hideEmptyState(); }
            refreshSwitcher();
            refreshEvolutionLegend();
            refreshRegenerateButton();
            refreshGroupsButton();
            if (selectedCellId) { renderPanel(selectedCellId); }
            // fitToViewport() is now called via render:done (pendingFit flag) — no setTimeout needed.
            // Rebuild tour nodes for the new diagram
            buildTourNodes();
            var tourBtnEl = document.getElementById('tour-btn');
            if (tourBtnEl) { tourBtnEl.style.display = tourNodes.length > 0 ? '' : 'none'; }
            if (wasTouring && sameDiagram && tourNodes.length > 0) {
                // Restore the tour at the step we were on (re-find by node id in case steps
                // changed). Re-renders the panel so a just-added comment is visible.
                var restoreIdx = 0;
                for (var ti = 0; ti < tourNodes.length; ti++) {
                    if (tourNodes[ti].id === prevTourNodeId) { restoreIdx = ti; break; }
                }
                tourActive = true;
                var tourOverlayEl = document.getElementById('tour-overlay');
                if (tourOverlayEl) { tourOverlayEl.style.display = 'flex'; }
                tourGoTo(restoreIdx);
            } else if (tourActive) {
                tourStop();
            }
        } catch (err) {
            console.error('[archi] loadDiagram build failed', err);
        }
    } else if (e.data.type === 'generating') {
        // Server-side generation is in flight and cancellable — show + (re-)enable the button.
        genOverlayMsg.textContent = 'Generating ' + e.data.diagramType + ' diagram…';
        if (genCancelBtn) {
            genCancelBtn.style.display = '';
            genCancelBtn.disabled = false;
        }
        genOverlay.classList.add('visible');
    } else if (e.data.type === 'selectNode') {
        var nodeId = e.data.nodeId;
        var targetCell = graph.getCell(nodeId);
        if (!targetCell) return;
        selectedCellId = nodeId;
        paper.findViewByModel(targetCell).highlight();
        var bbox = targetCell.getBBox();
        paper.setOrigin(-bbox.x + (paper.el.offsetWidth / 2) - (bbox.width / 2), -bbox.y + (paper.el.offsetHeight / 2) - (bbox.height / 2));
        renderPanel(nodeId);
    } else if (e.data.type === 'doExportPng') {
        exportPng();
    }
});

// ---- empty-state overlay ----
var EMPTY_STATE_ID = 'archi-empty-state';

function showEmptyState() {
    hideEmptyState();
    var el = document.createElement('div');
    el.id = EMPTY_STATE_ID;
    el.style.cssText = [
        'position:absolute',
        'inset:0',
        'display:flex',
        'flex-direction:column',
        'align-items:center',
        'justify-content:center',
        'gap:12px',
        'pointer-events:auto',
        'z-index:2500',
    ].join(';');
    var msg = document.createElement('p');
    var hasDiagram = Boolean(data.activeId);
    msg.textContent = hasDiagram ? 'This diagram is blank.' : 'This bundle has no diagrams.';
    msg.style.cssText = 'margin:0;font-size:calc(14px * var(--archi-text-scale));color:' + data.theme.muted + ';';
    el.appendChild(msg);
    if (data.readOnly === true) {
        cyWrap.appendChild(el);
        return;
    }
    var btn = document.createElement('button');
    btn.id = hasDiagram ? 'add-first-node-btn' : 'add-diagram-btn';
    btn.textContent = hasDiagram ? 'Add first node' : 'Add diagram';
    btn.style.cssText = [
        'background:' + data.theme.accent,
        'color:' + data.theme.accentText,
        'border:none',
        'border-radius:6px',
        'padding:6px 18px',
        'font-size:calc(13px * var(--archi-text-scale))',
        'font-weight:600',
        'cursor:pointer',
    ].join(';');
    btn.addEventListener('click', function() {
        if (hasDiagram) {
            editMode = true;
            applyEditModeState();
            hideEmptyState();
            beginAddNodeAtCanvasCenter();
        } else {
            host.postMessage({ type: 'addDiagram' });
        }
    });
    el.appendChild(btn);
    cyWrap.appendChild(el);
}

function hideEmptyState() {
    var existing = document.getElementById(EMPTY_STATE_ID);
    if (existing && existing.parentNode) { existing.parentNode.removeChild(existing); }
}

// ---- export PNG ----
function exportPng() {
    var bbox = graph.getBBox();
    if (!bbox || bbox.width === 0 || bbox.height === 0) {
        host.postMessage({ type: 'pngExportError', message: 'Diagram is empty — nothing to export.' });
        return;
    }

    // 1. Clone the paper's SVG element and strip the live pan/zoom transform.
    // JointJS 4 applies this to g.joint-layers (older builds used joint-viewport).
    // Keeping it makes export geometry depend on the current zoom: zoomed-out views
    // render tiny in one corner of a huge PNG; zoomed-in views are shifted/clipped.
    var svgEl = paper.svg;
    var clone = svgEl.cloneNode(true);

    var layers = clone.querySelector('.joint-layers');
    if (layers) { layers.removeAttribute('transform'); }
    var viewport = clone.querySelector('.joint-viewport');
    if (viewport) { viewport.removeAttribute('transform'); }

    // 2. Set viewBox and dimensions to content bbox + padding
    var vx = bbox.x - EXPORT_PADDING;
    var vy = bbox.y - EXPORT_PADDING;
    var vw = bbox.width + EXPORT_PADDING * 2;
    var vh = bbox.height + EXPORT_PADDING * 2;
    // Clamp the density so a big diagram's canvas stays within the browser limits —
    // past them canvas.toBlob() returns null and the export silently fails.
    var exportScale = EXPORT_SCALE;
    exportScale = Math.min(exportScale, EXPORT_MAX.dimPx / vw, EXPORT_MAX.dimPx / vh);
    if (vw * vh * exportScale * exportScale > EXPORT_MAX.areaPx) {
        exportScale = Math.sqrt(EXPORT_MAX.areaPx / (vw * vh));
    }
    exportScale = Math.max(EXPORT_MAX.minScale, exportScale);
    clone.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
    clone.setAttribute('width', String(vw * exportScale));
    clone.setAttribute('height', String(vh * exportScale));

    // 3. Prepend background rect
    var bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', String(vx));
    bgRect.setAttribute('y', String(vy));
    bgRect.setAttribute('width', String(vw));
    bgRect.setAttribute('height', String(vh));
    bgRect.setAttribute('fill', data.theme.bg);
    clone.insertBefore(bgRect, clone.firstChild);

    // 4. Ensure text elements inherit a readable font-family
    var textEls = clone.querySelectorAll('text');
    for (var ti = 0; ti < textEls.length; ti++) {
        if (!textEls[ti].getAttribute('font-family')) {
            textEls[ti].setAttribute('font-family', 'system-ui, sans-serif');
        }
    }

    // 5. Serialize SVG -> data URI
    var serializer = new XMLSerializer();
    var svgStr = serializer.serializeToString(clone);
    var svgDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);

    // 6. Load into Image -> draw onto offscreen Canvas -> toBlob -> base64
    var img = new Image();
    img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = vw * exportScale;
        canvas.height = vh * exportScale;
        var ctx = canvas.getContext('2d');
        if (!ctx) {
            host.postMessage({ type: 'pngExportError', message: 'Canvas 2D context unavailable.' });
            return;
        }
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(function(blob) {
            if (!blob) {
                host.postMessage({ type: 'pngExportError', message: 'Canvas toBlob returned null.' });
                return;
            }
            var reader = new FileReader();
            reader.onload = function() {
                var dataUrl = reader.result;
                // Strip the data URI prefix to get bare base64
                var base64 = typeof dataUrl === 'string' ? dataUrl.split(',')[1] : null;
                if (!base64) {
                    host.postMessage({ type: 'pngExportError', message: 'Failed to encode PNG as base64.' });
                    return;
                }
                var activeName = (data.diagramName || data.activeType || 'diagram');
                var suggestedName = activeName.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') + '.png';
                if (suggestedName === '.png') { suggestedName = 'diagram.png'; }
                host.postMessage({ type: 'pngExported', dataBase64: base64, suggestedName: suggestedName });
            };
            reader.onerror = function() {
                host.postMessage({ type: 'pngExportError', message: 'FileReader error during base64 encoding.' });
            };
            reader.readAsDataURL(blob);
        }, 'image/png');
    };
    img.onerror = function() {
        host.postMessage({ type: 'pngExportError', message: 'Failed to load SVG into Image element.' });
    };
    img.src = svgDataUri;
}

// ---- initial build ----
refreshSwitcher();
buildLoadedDiagram();
if (currentDoc.nodes.length === 0) { showEmptyState(); }
// fitToViewport() is now called via render:done (pendingFit flag) — no setTimeout needed.

// ---- side panel collapse ----
var sideToggleBtn = document.getElementById('side-toggle');
var appEl = document.getElementById('app');

function expandSidePanel() {
    if (appEl.classList.contains('side-collapsed')) {
        appEl.classList.remove('side-collapsed');
        sideToggleBtn.textContent = '›';
        sideToggleBtn.title = 'Collapse panel';
        setTimeout(function() { fitContent(); positionOverlays(); }, 160);
    }
}

sideToggleBtn.addEventListener('click', function() {
    var collapsed = appEl.classList.toggle('side-collapsed');
    sideToggleBtn.textContent = collapsed ? '‹' : '›';
    sideToggleBtn.title = collapsed ? 'Expand panel' : 'Collapse panel';
    // nudge JointJS paper so it uses the new canvas width
    setTimeout(function() { fitContent(); positionOverlays(); }, 160);
});

// ---- find bar ----
var FIND = {
    dimOpacity: 0.15,        // opacity for non-matching nodes
    accentOpacity: 1.0,      // opacity for matching nodes (restored)
    matchOutlineWidth: 2.5,  // strokeWidth highlight for current match
    scrollCenterOffset: 0.5, // fraction to center (0.5 = exact center)
};

// ---- tour navigator ----
var TOUR = {
    overlayTopPx: 10,    // px from top of cy-wrap
    overlayRightPx: 54,  // px from right of cy-wrap (clears zoom toolbar)
    overlayZIndex: 3500, // above overlays (1000) and zoom-toolbar (2000), below inline input (4000)
    highlightColor: data.tourHighlight, // theme-derived magenta/violet — see evolution-colors.ts tourHighlightColor()
    highlightWidth: 4,         // px stroke for the current tour node (vs the default 1.5)
};

var EXPORT_SCALE = 2;    // pixel density multiplier for a crisp PNG (2× = 144 dpi equivalent)
var EXPORT_PADDING = 40; // px of blank margin added around the diagram content bounding box
// Rasterization-safe export caps. Exceeding either makes canvas.toBlob() return null (or,
// for SVG-to-Image rasterization, silently renders the bottom portion blank). dimPx is set
// to 8192 — well below the 16384 canvas-creation ceiling — because SVG→Image rasterization
// in Chrome/Electron fails (blank output) long before the canvas creation limit is reached.
var EXPORT_MAX = {
    dimPx: 8192,         // SVG-image rasterization-safe cap (not the canvas creation ceiling)
    areaPx: 268435456,   // ~16384² max total pixels (Chrome area cap)
    minScale: 0.25,      // floor so an enormous diagram still exports (just lower-res)
};

var findBar = document.getElementById('find-bar');
var findInput = document.getElementById('find-input');
var findCounter = document.getElementById('find-counter');
var findPrev = document.getElementById('find-prev');
var findNext = document.getElementById('find-next');
var findCloseBtn = document.getElementById('find-close');
var findMatches = [];
var findIndex = 0;

function findOpen() {
    findBar.style.display = 'flex';
    findInput.focus();
    findInput.select();
}

function findClose_() {
    findBar.style.display = 'none';
    findInput.value = '';
    findClear();
}

function findClear() {
    // Restore all nodes to full opacity and remove match outline
    graph.getElements().forEach(function(el) {
        if (el.prop('seqLifeline')) return;
        el.attr('body/opacity', FIND.accentOpacity);
        el.attr('body/strokeWidth', 1.5);
    });
    findMatches = [];
    findIndex = 0;
    findCounter.textContent = '';
}

function nodeMatchesQuery(node, query) {
    var q = query.toLowerCase();
    if (node.label && node.label.toLowerCase().indexOf(q) !== -1) return true;
    var files = node.files || [];
    for (var fi = 0; fi < files.length; fi++) {
        if (files[fi].toLowerCase().indexOf(q) !== -1) return true;
    }
    var members = node.members || [];
    for (var mi = 0; mi < members.length; mi++) {
        if (members[mi].toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
}

function findApply() {
    var query = findInput.value.trim();
    if (!query) { findClear(); return; }
    findMatches = [];
    for (var i = 0; i < currentDoc.nodes.length; i++) {
        if (nodeMatchesQuery(currentDoc.nodes[i], query)) {
            findMatches.push(currentDoc.nodes[i].id);
        }
    }
    var matchSet = {};
    for (var j = 0; j < findMatches.length; j++) { matchSet[findMatches[j]] = true; }
    graph.getElements().forEach(function(el) {
        if (el.prop('seqLifeline') || (el.prop('seqActor') && currentDoc.type === 'sequence')) return;
        if (matchSet[el.id]) {
            el.attr('body/opacity', FIND.accentOpacity);
        } else {
            el.attr('body/opacity', FIND.dimOpacity);
        }
    });
    if (findMatches.length > 0) {
        findIndex = 0;
        findHighlightCurrent();
    } else {
        findCounter.textContent = '0/0';
    }
}

function findHighlightCurrent() {
    if (findMatches.length === 0) return;
    // Remove outline from all
    graph.getElements().forEach(function(el) {
        if (!el.prop('seqLifeline')) {
            el.attr('body/strokeWidth', 1.5);
        }
    });
    var curId = findMatches[findIndex];
    var curEl = graph.getCell(curId);
    if (curEl) {
        curEl.attr('body/strokeWidth', FIND.matchOutlineWidth);
        // Center the current match in the viewport
        var bbox = curEl.getBBox();
        if (bbox) {
            var targetScrollLeft = (bbox.x + bbox.width * FIND.scrollCenterOffset) * scale - cyScroll.clientWidth * FIND.scrollCenterOffset;
            var targetScrollTop  = (bbox.y + bbox.height * FIND.scrollCenterOffset) * scale - cyScroll.clientHeight * FIND.scrollCenterOffset;
            cyScroll.scrollLeft = Math.max(0, targetScrollLeft);
            cyScroll.scrollTop  = Math.max(0, targetScrollTop);
        }
    }
    findCounter.textContent = (findIndex + 1) + '/' + findMatches.length;
}

function findStep(dir) {
    if (findMatches.length === 0) return;
    findIndex = (findIndex + dir + findMatches.length) % findMatches.length;
    findHighlightCurrent();
}

findInput.addEventListener('input', findApply);
findInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); findStep(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); findStep(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); findClose_(); }
});
findPrev.addEventListener('click', function() { findStep(-1); });
findNext.addEventListener('click', function() { findStep(1); });
findCloseBtn.addEventListener('click', findClose_);

// Ctrl/Cmd+F: intercept and open find bar
window.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        findOpen();
    }
});

// ---- tour navigator ---- (tourNodes/tourIndex/tourActive declared at top of script)
function buildTourNodes() {
    tourNodes = currentDoc.nodes
        .filter(function(n) { return typeof n.step === 'number'; })
        .slice()
        .sort(function(a, b) { return a.step - b.step; });
}

buildTourNodes();

// Remember the node we recoloured for the tour so we can restore its exact original
// stroke/width when moving on — instead of bluntly resetting every element.
var tourPrevEl = null;
var tourPrevStroke = null;
var tourPrevWidth = null;

function clearTourHighlight() {
    if (tourPrevEl) {
        tourPrevEl.attr('body/stroke', tourPrevStroke);
        tourPrevEl.attr('body/strokeWidth', tourPrevWidth);
        tourPrevEl = null;
    }
}

function tourGoTo(i) {
    if (tourNodes.length === 0) { return; }
    tourIndex = Math.max(0, Math.min(i, tourNodes.length - 1));
    var tourNode = tourNodes[tourIndex];
    var nodeId = tourNode.id;
    clearTourHighlight();
    var curEl = graph.getCell(nodeId);
    if (curEl) {
        tourPrevEl = curEl;
        tourPrevStroke = curEl.attr('body/stroke');
        tourPrevWidth = curEl.attr('body/strokeWidth');
        curEl.attr('body/stroke', TOUR.highlightColor);
        curEl.attr('body/strokeWidth', TOUR.highlightWidth);
        var bbox = curEl.getBBox();
        if (bbox) {
            var targetScrollLeft = (bbox.x + bbox.width * FIND.scrollCenterOffset) * scale - cyScroll.clientWidth * FIND.scrollCenterOffset;
            var targetScrollTop  = (bbox.y + bbox.height * FIND.scrollCenterOffset) * scale - cyScroll.clientHeight * FIND.scrollCenterOffset;
            cyScroll.scrollLeft = Math.max(0, targetScrollLeft);
            cyScroll.scrollTop  = Math.max(0, targetScrollTop);
        }
    }
    // Select node and open its panel
    selectedCellId = nodeId;
    renderPanel(nodeId);
    // Update counter
    var tourCounter = document.getElementById('tour-counter');
    if (tourCounter) { tourCounter.textContent = (tourIndex + 1) + ' / ' + tourNodes.length; }
}

function tourStart() {
    if (tourNodes.length === 0) { return; }
    tourActive = true;
    var tourOverlay = document.getElementById('tour-overlay');
    if (tourOverlay) { tourOverlay.style.display = 'flex'; }
    expandSidePanel(); // surface each node's note as the tour walks them
    tourGoTo(0);
}

function tourStop() {
    tourActive = false;
    var tourOverlay = document.getElementById('tour-overlay');
    if (tourOverlay) { tourOverlay.style.display = 'none'; }
    clearTourHighlight();
}

var tourBtn = document.getElementById('tour-btn');
if (tourBtn) {
    tourBtn.style.display = tourNodes.length > 0 ? '' : 'none';
    tourBtn.addEventListener('click', tourStart);
}

var tourPrev = document.getElementById('tour-prev');
var tourNext = document.getElementById('tour-next');
var tourDone = document.getElementById('tour-done');
if (tourPrev) { tourPrev.addEventListener('click', function() { tourGoTo(tourIndex - 1); }); }
if (tourNext) { tourNext.addEventListener('click', function() { tourGoTo(tourIndex + 1); }); }
if (tourDone) { tourDone.addEventListener('click', tourStop); }

// Esc closes tour if active
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && tourActive) { tourStop(); }
});
</script>
</body>
