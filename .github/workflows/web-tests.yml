name: Web tests

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - run: npm run test:coverage:rust
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: line-coverage
          path: web/coverage/*.lcov

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # build:wasm:threaded pins this nightly and needs rust-src for -Z build-std.
      # Installed before stable so that stable stays the default toolchain; the
      # threaded build reaches nightly explicitly via `rustup run`.
      # Keep the version in step with package.json.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm run test:coverage:browser
        working-directory: web
      - run: npm run test:iphone-safari
        working-directory: web
